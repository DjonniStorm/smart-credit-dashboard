[project]
name = "scoring"
version = "0.1.0"
description = "Оценка риска заявки (правила/баллы)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.151.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
