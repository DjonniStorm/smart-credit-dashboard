  <ellipse cx="64" cy="58" rx="42" ry="36" fill="#EF3124"/>
  <path d="M26 66 Q30 92 64 94 Q98 92 102 66 Q96 86 64 88 Q32 86 26 66Z" fill="#C42318"/>
  <ellipse cx="38" cy="38" rx="14" ry="7" transform="rotate(-35 38 38)" fill="#FF6B58" opacity=".75"/>
  <ellipse cx="18" cy="60" rx="9" ry="17" fill="#2A2D34"/><ellipse cx="110" cy="60" rx="9" ry="17" fill="#2A2D34"/>
  <ellipse cx="16" cy="56" rx="2.6" ry="7" fill="#656B78"/><ellipse cx="108" cy="56" rx="2.6" ry="7" fill="#656B78"/>
  <ellipse cx="64" cy="61" rx="32" ry="25" fill="#FFF4EE"/>
  <g class="eyes"><ellipse cx="54" cy="58" rx="6" ry="7.5" fill="#1F1416"/><ellipse cx="80" cy="58" rx="6" ry="7.5" fill="#1F1416"/>
    <circle cx="56" cy="55" r="2.4" fill="#fff"/><circle cx="82" cy="55" r="2.4" fill="#fff"/></g>
  <circle cx="42" cy="70" r="5.5" fill="#FF9C8C" opacity=".85"/><circle cx="86" cy="70" r="5.5" fill="#FF9C8C" opacity=".85"/>
  <path d="M57 68 Q64 76 71 68" fill="none" stroke="#1F1416" stroke-width="3.5" stroke-linecap="round"/>
  
  <g class="lens"><path d="M92 99 L83 110" stroke="#8F1A12" stroke-width="7" stroke-linecap="round"/>
    <circle cx="101" cy="86" r="16" fill="#FFF4EE" stroke="#8F1A12" stroke-width="5"/>
    <path d="M92 82 Q94 76 100 74" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
