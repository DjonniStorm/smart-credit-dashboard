<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t d">
  <title id="t">Альфи проверяет</title><desc id="d">Альфи смотрит через лупу на данные или документ.</desc>
  <style>
  .antenna{transform-box:view-box;transform-origin:64px 24px;animation:antenna .9s ease-out 1}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s 1.2s infinite}
  @keyframes antenna{0%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .lens{transform-box:view-box;transform-origin:82px 112px;animation:scan 1.1s ease-in-out 3 alternate}
  @keyframes scan{from{transform:rotate(-8deg) translateX(-2px)}to{transform:rotate(6deg) translateX(2px)}}
  </style>
  <g class="alfi">
  <path d="M20 52 C20 6 108 6 108 52" fill="none" stroke="#2A2D34" stroke-width="6" stroke-linecap="round"/>
  <g class="antenna"><path d="M64 24 V14" stroke="#8F1A12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="10" r="7" fill="#FFB81C"/><circle cx="62" cy="8" r="2.4" fill="#fff" opacity=".8"/></g>
  <ellipse cx="64" cy="104" rx="30" ry="22" fill="#EF3124"/>
