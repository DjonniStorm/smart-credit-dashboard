<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t d">
  <title id="t">Шаг завершён</title><desc id="d">Альфи радуется, на груди галочка.</desc>
  <style>
  .antenna{transform-box:view-box;transform-origin:64px 24px;animation:antenna .9s ease-out 1}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s 1.2s infinite}
  @keyframes antenna{0%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .alfi{animation:hop .45s ease-out 2}
  .arm-left{transform-box:view-box;transform-origin:34px 96px;animation:cheer-left .45s ease-in-out 2}
  .arm-right{transform-box:view-box;transform-origin:94px 96px;animation:cheer-right .45s ease-in-out 2}
  @keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-7px)}}
  @keyframes cheer-left{0%,100%{transform:rotate(0)}45%{transform:rotate(10deg)}}
  @keyframes cheer-right{0%,100%{transform:rotate(0)}45%{transform:rotate(-10deg)}}
  </style>
