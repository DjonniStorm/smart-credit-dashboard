<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="t d">
  <title id="t">От вас нужен ответ</title><desc id="d">Рядом с Альфи вопросительный знак: нужно уточнить поле.</desc>
  <style>
  .antenna{transform-box:view-box;transform-origin:64px 24px;animation:antenna .9s ease-out 1}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s 1.2s infinite}
  @keyframes antenna{0%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .bubble{transform-box:view-box;transform-origin:90px 38px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) 1 both, bob 1.2s .6s ease-in-out 2 alternate}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
  </style>
