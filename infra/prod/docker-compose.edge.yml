services:
  caddy:
    profiles: ["off"]
  api:
    networks:
      default: {}
      edge:
        aliases:
          - alfa-api
  client:
    networks:
      default: {}
      edge:
        aliases:
          - alfa-client
  backoffice:
    networks:
      default: {}
      edge:
        aliases:
          - alfa-backoffice

networks:
  edge:
    name: hh-edge
    external: true
