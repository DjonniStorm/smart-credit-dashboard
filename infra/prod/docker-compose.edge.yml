services:
  caddy:
    profiles: ["off"]
  api:
    networks:
      default: {}
      edge:
        aliases:
          - alfa-api
  client:
    networks:
      default: {}
      edge:
        aliases:
          - alfa-client
  backoffice:
    networks:
      default: {}
      edge:
        aliases:
          - alfa-backoffice
  docs:
    build:
      context: ../../docs/prod/site
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      default: {}
      edge:
        aliases:
          - alfa-docs

networks:
  edge:
    name: hh-edge
    external: true
