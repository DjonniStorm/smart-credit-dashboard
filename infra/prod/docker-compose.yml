# Все сервисы в контейнерах. Запуск из корня репозитория:
#   docker compose -f infra/prod/docker-compose.yml up --build
# Переменные: infra/prod/.env (шаблон — .env.example), без него работают значения по умолчанию.
name: alfa-future

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa}
      POSTGRES_DB: ${POSTGRES_DB:-alfa}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  scoring:
    build:
      context: ../..
      dockerfile: apps/scoring/Dockerfile
    restart: unless-stopped
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alfa}:${POSTGRES_PASSWORD:-alfa}@postgres:5432/${POSTGRES_DB:-alfa}
      SCORING_URL: http://scoring:8000
    depends_on:
      postgres:
        condition: service_healthy
      scoring:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  client:
    build:
      context: ../..
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  backoffice:
    build:
      context: ../..
      dockerfile: apps/backoffice/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SCHEME: ${SCHEME:-http}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      client:
        condition: service_healthy
      backoffice:
        condition: service_healthy
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.9.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox-exporter

  grafana:
    image: grafana/grafana:12.3.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "GRAFANA_ADMIN_PASSWORD must be set in infra/prod/.env" >&2; exit 1; }; exec /run.sh'
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [monitoring]
    restart: unless-stopped
    command: [--docker_only=true]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    profiles: [monitoring]
    restart: unless-stopped
    command: [--config.file=/etc/blackbox_exporter/config.yml]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
