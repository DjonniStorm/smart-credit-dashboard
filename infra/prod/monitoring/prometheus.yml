global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: [prometheus:9090]

  - job_name: api-metrics
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [api:4000]

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: blackbox
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://client:3000/
          - http://backoffice:3001/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: api-health
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [api_health]
    static_configs:
      - targets: [http://api:4000/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: scoring-health
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [scoring_health]
    static_configs:
      - targets: [http://scoring:8000/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
