pre-commit:
  piped: true
  commands:
    prettier:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,md,yml,yaml,css}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}
